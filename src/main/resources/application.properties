# Server port
server.port=${PORT:8080}

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:outpassdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Data JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI Integration
# Set GEMINI_API_KEY as an environment variable in your deployment platform.
# For local development, export GEMINI_API_KEY=<your_key> before running.
gemini.api.key=${GEMINI_API_KEY:placeholder-set-env-var}
